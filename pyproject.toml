[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qpl"
version = "0.1.0"
description = "Quant Pricing Lab: analytic, Monte Carlo, and PDE engines for option pricing (portfolio project)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.16,<0.17",
  "black>=24.0",
  "mypy>=1.8",
  "ipykernel>=6.0",
  "jupyter>=1.0",
  "nbstripout>=0.7",
]
data = [
  "pandas>=2.0",
  "yfinance>=0.2.0",
  "pyarrow>=14.0",
]
oracle = [
  "QuantLib>=1.30",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff's own "default" rule set changed between 0.14 and 0.16 (0.14's
# built-in default is E4/E7/E9/F only; 0.16's is a much broader set spanning
# many more plugins). Left unselected, that means the set of rules actually
# enforced silently depends on which ruff version happens to be installed.
# Pin it explicitly instead: the original baseline plus the exact rule codes
# that 0.16's broader default newly surfaced on this codebase (and that have
# since been fixed), so upgrading ruff again does not silently expand what
# gets checked.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "B017",
  "BLE001",
  "I001",
  "PIE790",
  "PLR0402",
  "RUF007",
  "RUF022",
  "RUF046",
  "SIM102",
  "UP007",
  "UP024",
  "UP035",
  "W605",
]

[tool.ruff.lint.isort]
# Without this, ruff's isort splits `from x import a, b as c` across
# multiple `from x import (...)` statements whenever any name is aliased,
# which is correct but needlessly noisy for this codebase's `as`-aliased
# engine re-exports (see src/qpl/pricing.py).
combine-as-imports = true
